<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeMind AI • Autonomous Full-Stack Software Generation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          var errDiv = document.createElement('div');
          errDiv.style.cssText = 'padding: 24px; margin: 24px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 16px; color: #fca5a5; font-family: monospace; font-size: 13px;';
          errDiv.innerHTML = '<strong style="color: #ef4444; font-size: 15px;">⚠️ CodeMind AI Startup Notice:</strong><br/><br/>' + (e.message || 'Script initialization error') + '<br/><span style="color:#94a3b8; font-size: 11px;">Source: ' + (e.filename || 'unknown') + ':' + e.lineno + '</span><br/><br/><button onclick="window.location.reload(true)" style="background:#6366f1; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold;">Hard Refresh (Ctrl + F5)</button>';
          root.appendChild(errDiv);
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
